[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-pipeline"
version = "1.0.0"
description = "Pipeline de pós-produção de vídeo 100% local com IA"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "faster-whisper",
    "streamlit",
    "python-dotenv",
    "sqlalchemy>=2",
    "requests>=2.31",
    "pyyaml",
    "pytest",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "torch",
]
cloud = [
    "google-genai",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]